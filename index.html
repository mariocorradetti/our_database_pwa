<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DATABASE</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: #111318;
      color: #f4f4f5;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
      padding: 24px;
    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 600;
      transition: .15s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #f4f4f5;
      color: #111318;
    }

    .btn-secondary {
      background: #252a34;
      color: white;
      border: 1px solid #343a46;
    }

    .btn-danger {
      background: #3a2024;
      color: #ffb4b4;
      border: 1px solid #6a3037;
    }


    /* =====================================================
       LOGIN
       ===================================================== */

    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #1a1d24;
      border: 1px solid #2b303b;
      border-radius: 24px;
      padding: 35px;
      box-shadow:
        0 20px 60px rgba(0,0,0,.35);
      text-align: center;
    }

    .logo {
      font-size: 48px;
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
      margin-top: 8px;
    }

    .subtitle {
      color: #9ca3af;
      margin: 8px 0 30px;
    }

    .user-buttons {
      display: grid;
      gap: 12px;
    }

    .user-button {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #343a46;
      background: #222630;
      color: white;
      transition: .15s;
    }

    .user-button:hover {
      background: #2c313d;
      transform: translateY(-1px);
    }


    /* =====================================================
       TOP BAR
       ===================================================== */

    .topbar {
      max-width: 1200px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 25px;
      font-weight: 700;
    }

    .user-pill {
      background: #20242d;
      border: 1px solid #343a46;
      padding: 9px 13px;
      border-radius: 999px;
      color: #d1d5db;
      font-size: 14px;
    }


    /* =====================================================
       CONTENT
       ===================================================== */

    .content {
      max-width: 1200px;
      margin: 0 auto;
    }

    .search-box {
      margin-bottom: 24px;
    }

    .search-box input {
      width: 100%;
      padding: 15px 18px;
      border-radius: 14px;
      border: 1px solid #343a46;
      background: #1a1d24;
      color: white;
      outline: none;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
    }


    /* =====================================================
       FAVORITES HOME CARD
       ===================================================== */

    .favorites-card {
      background:
        linear-gradient(
          135deg,
          #25231b,
          #1a1d24
        );

      border: 1px solid #4a4330;

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 30px;

      cursor: pointer;

      transition: .15s;
    }

    .favorites-card:hover {
      transform: translateY(-2px);
      border-color: #75683e;
    }

    .favorites-title {
      font-size: 18px;
      font-weight: 700;
    }

    .favorites-count {
      color: #a9a293;
      font-size: 13px;
      margin-top: 5px;
    }


    /* =====================================================
       CATEGORY GRID
       ===================================================== */

    .category-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .category-card {
      background: #1a1d24;
      border: 1px solid #2b303b;
      border-radius: 18px;
      padding: 22px;
      transition: .15s;
      cursor: pointer;
    }

    .category-card:hover {
      transform: translateY(-2px);
      border-color: #4b5260;
      background: #20242c;
    }

    .category-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .category-name {
      font-weight: 650;
    }


    /* =====================================================
       ITEMS
       ===================================================== */

    .items-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .item-card {
      background: #1a1d24;
      border: 1px solid #2b303b;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      transition: .15s;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: #4b5260;
    }

    .item-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .item-category {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 12px;
    }

    .card-favorite {
      float: right;
      color: #f5c451;
      font-size: 18px;
    }

    .rating-preview {
      margin-top: 12px;
      color: #f5c451;
    }

    .empty {
      color: #8d95a3;
      padding: 20px 0;
    }


    /* =====================================================
       CATEGORY
       ===================================================== */

    .back-row {
      max-width: 1200px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .category-header-icon {
      font-size: 32px;
    }

    .category-header h1 {
      margin: 0;
      font-size: 25px;
    }


    /* =====================================================
       DETAIL
       ===================================================== */

    .detail-container {
      max-width: 850px;
      margin: 0 auto;
    }

    .detail-card {
      background: #1a1d24;
      border: 1px solid #2b303b;
      border-radius: 22px;
      padding: 28px;
    }

    .detail-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .detail-title {
      font-size: 30px;
      font-weight: 750;
      margin: 0 0 7px;
    }

    .detail-category {
      color: #9ca3af;
      font-size: 14px;
    }

    .detail-favorite-button {
      border: none;
      background: transparent;
      font-size: 32px;
      padding: 3px;
      color: #454b56;
    }

    .detail-favorite-button.active {
      color: #f5c451;
    }

    .detail-section {
      border-top: 1px solid #2b303b;
      padding-top: 22px;
      margin-top: 22px;
    }

    .detail-section h3 {
      margin-top: 0;
      margin-bottom: 17px;
      font-size: 17px;
    }


    /* =====================================================
       RATINGS
       ===================================================== */

    .ratings-box {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .person-rating {
      background: #222630;
      border: 1px solid #343a46;
      border-radius: 16px;
      padding: 17px;
    }

    .person-name {
      font-weight: 650;
      margin-bottom: 10px;
    }

    .stars {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .star {
      border: none;
      background: transparent;
      padding: 0;
      font-size: 25px;
      color: #454b56;
      line-height: 1;
    }

    .star.active {
      color: #f5c451;
    }

    .star.disabled {
      cursor: default;
    }

    .rating-text {
      color: #9ca3af;
      font-size: 13px;
    }

    .average-rating {
      margin-top: 16px;
      text-align: center;
      color: #f5c451;
      font-size: 18px;
      font-weight: 650;
    }


    /* =====================================================
       DETAILS
       ===================================================== */

    .details-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .detail-field {
      background: #20242c;
      border-radius: 12px;
      padding: 13px;
    }

    .detail-label {
      font-size: 11px;
      color: #8f97a5;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .detail-value {
      font-size: 14px;
      word-break: break-word;
    }

    .description {
      color: #d4d7dc;
      line-height: 1.6;
      white-space: pre-wrap;
    }


    /* =====================================================
       FORM
       ===================================================== */

    .form-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .form-card {
      background: #1a1d24;
      border: 1px solid #2b303b;
      border-radius: 22px;
      padding: 28px;
    }

    .form-title {
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 13px;
      color: #b7bdc8;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 13px;
      border-radius: 11px;
      border: 1px solid #343a46;
      background: #222630;
      color: white;
      outline: none;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
    }


    /* =====================================================
       TOAST
       ===================================================== */

    #toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform:
        translateX(-50%)
        translateY(20px);
      background: #f4f4f5;
      color: #111318;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 700px) {

      .screen {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .details-grid,
      .ratings-box {
        grid-template-columns: 1fr;
      }

      .detail-title {
        font-size: 24px;
      }

    }

  
/* =========================================================
   MOBILE READABILITY — LARGE TEXT / TOUCH CONTROLS
   ========================================================= */
@media (max-width: 700px) {

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    font-size: 18px !important;
  }

  .screen {
    padding: 18px 14px 32px !important;
  }

  /* Header */
  .topbar {
    gap: 12px !important;
    margin-bottom: 22px !important;
  }

  .topbar .brand,
  .brand {
    font-size: 27px !important;
  }

  .user-pill {
    font-size: 16px !important;
    padding: 10px 13px !important;
  }

  /* Buttons */
  .btn {
    min-height: 50px !important;
    padding: 13px 18px !important;
    font-size: 17px !important;
    line-height: 1.2 !important;
  }

  /* Search */
  .search-box input,
  #searchInput {
    min-height: 54px !important;
    padding: 14px 16px !important;
    font-size: 18px !important;
  }

  /* Home / section headings */
  .section-title {
    font-size: 23px !important;
    line-height: 1.2 !important;
  }

  .category-header h1,
  .category-title {
    font-size: 27px !important;
    line-height: 1.2 !important;
  }

  .category-header-icon {
    font-size: 34px !important;
  }

  /* Cards */
  .card {
    padding: 19px !important;
  }

  .card-title {
    font-size: 20px !important;
    line-height: 1.3 !important;
  }

  .card-subtitle,
  .card-meta,
  .card-description {
    font-size: 17px !important;
    line-height: 1.45 !important;
  }

  .category-card {
    min-height: 86px !important;
    padding: 18px !important;
  }

  .category-card .category-name,
  .category-card-title {
    font-size: 19px !important;
    line-height: 1.3 !important;
  }

  /* Favorites */
  .favorites-card {
    padding: 19px !important;
  }

  .favorites-title {
    font-size: 20px !important;
  }

  .favorites-count {
    font-size: 17px !important;
  }

  /* Forms */
  .form-group {
    margin-bottom: 18px !important;
  }

  .form-group label {
    display: block !important;
    font-size: 16px !important;
    line-height: 1.3 !important;
    margin-bottom: 8px !important;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    min-height: 52px !important;
    padding: 14px 15px !important;
    font-size: 17px !important;
    line-height: 1.35 !important;
  }

  .form-group textarea {
    min-height: 130px !important;
  }

  /* Details */
  .detail-card {
    padding: 20px !important;
  }

  .detail-title-row {
    gap: 12px !important;
    margin-bottom: 22px !important;
  }

  .detail-title {
    font-size: 29px !important;
    line-height: 1.18 !important;
  }

  .detail-category {
    font-size: 16px !important;
  }

  .detail-favorite-button {
    font-size: 38px !important;
    min-width: 46px !important;
    min-height: 46px !important;
  }

  .detail-label {
    font-size: 15px !important;
    line-height: 1.3 !important;
  }

  .detail-value {
    font-size: 18px !important;
    line-height: 1.45 !important;
  }

  /* Ratings */
  .person-rating {
    padding: 18px !important;
  }

  .person-name {
    font-size: 18px !important;
    margin-bottom: 12px !important;
  }

  .star {
    font-size: 31px !important;
    padding: 2px !important;
  }

  .rating-text {
    font-size: 15px !important;
  }

  /* Empty states / secondary text */
  .empty {
    font-size: 17px !important;
    line-height: 1.5 !important;
  }

  /* Modal / dialogs */
  .modal-content {
    width: calc(100vw - 28px) !important;
    max-width: none !important;
    padding: 21px !important;
  }

  .modal-content h2,
  .modal-title {
    font-size: 24px !important;
    line-height: 1.25 !important;
  }

  /* Toasts */
  .toast {
    font-size: 16px !important;
    line-height: 1.35 !important;
    padding: 13px 16px !important;
  }

  /* Make action buttons easy to hit */
  .form-actions {
    gap: 12px !important;
  }

  .form-actions .btn {
    min-height: 52px !important;
  }
}

/* Very small phones */
@media (max-width: 390px) {
  body {
    font-size: 17px !important;
  }

  .topbar .brand,
  .brand {
    font-size: 25px !important;
  }

  .card-title {
    font-size: 19px !important;
  }

  .category-header h1,
  .category-title {
    font-size: 25px !important;
  }

  .detail-title {
    font-size: 27px !important;
  }

  .form-group input,
  .form-group textarea,
  .form-group select,
  #searchInput {
    font-size: 17px !important;
  }
}


/* Native WebView touch support */
html, body { min-height:100%; -webkit-tap-highlight-color:transparent; }
body { overscroll-behavior-y:contain; }
button, a, [onclick], .category-card, .item-card, .favorites-card {
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button { -webkit-appearance:none; }

</style>

</head>


<body>


<!-- =======================================================
     LOGIN
     ======================================================= -->

<section
  id="loginScreen"
  class="screen"
>

  <div class="login-card">

    <div class="logo">🗂️</div>

    <div class="app-title">
      DATABASE
    </div>

    <div class="subtitle">
      La raccolta condivisa
    </div>

    <div
      id="userButtons"
      class="user-buttons"
    ></div>

  </div>

</section>


<!-- =======================================================
     HOME
     ======================================================= -->

<section
  id="homeScreen"
  class="screen hidden"
>

  <div class="topbar">

    <div class="brand">
      DATABASE
    </div>

    <div
      id="userPill"
      class="user-pill"
    ></div>

  </div>


  <div class="content">

    <div class="search-box">

      <input
        id="searchInput"
        type="text"
        placeholder="🔎 Cerca nella database..."
        oninput="handleSearch()"
      >

    </div>


    <!-- FAVORITES -->

    <div
      id="favoritesCard"
      class="favorites-card"
      onclick="openFavorites()"
    >

      <div class="favorites-title">
        ⭐ Preferiti
      </div>

      <div
        id="favoritesCount"
        class="favorites-count"
      >
        0 elementi
      </div>

    </div>


    <!-- SEARCH -->

    <div
      id="searchResultsSection"
      class="hidden"
    >

      <div class="section-title">
        Risultati
      </div>

      <div
        id="searchResults"
        class="items-grid"
      ></div>

    </div>


    <!-- NORMAL HOME -->

    <div id="homeContent">

      <div class="section-title">
        Categorie
      </div>

      <div
        id="categoryGrid"
        class="category-grid"
      ></div>


      <div style="margin-top:35px">

        <div class="section-title">
          Aggiunti di recente
        </div>

        <div
          id="recentItems"
          class="items-grid"
        ></div>

      </div>

    </div>

  </div>

</section>


<!-- =======================================================
     CATEGORY
     ======================================================= -->

<section
  id="categoryScreen"
  class="screen hidden"
>

  <div class="back-row">

    <button
      class="btn btn-secondary"
      onclick="showHome()"
    >
      ← Home
    </button>

    <button
      class="btn btn-primary"
      onclick="showNewItemForm()"
    >
      ＋ Aggiungi
    </button>

  </div>


  <div class="content">

    <div class="category-header">

      <div
        id="categoryIcon"
        class="category-header-icon"
      ></div>

      <div>

        <h1 id="categoryTitle"></h1>

        <div
          id="categoryCount"
          style="
            color:#8f97a5;
            font-size:13px;
            margin-top:4px;
          "
        ></div>

      </div>

    </div>


    <div
      id="categoryItems"
      class="items-grid"
      style="margin-top:25px"
    ></div>

  </div>

</section>


<!-- =======================================================
     FORM
     ======================================================= -->

<section
  id="formScreen"
  class="screen hidden"
>

  <div class="back-row">

    <button
      class="btn btn-secondary"
      onclick="cancelForm()"
    >
      ← Indietro
    </button>

  </div>


  <div class="form-container">

    <div class="form-card">

      <h1
        id="formTitle"
        class="form-title"
      >
        Nuovo elemento
      </h1>


      <div
        id="dynamicForm"
        class="form-grid"
      ></div>


      <div class="form-actions">

        <button
          class="btn btn-secondary"
          onclick="cancelForm()"
        >
          Annulla
        </button>

        <button
          class="btn btn-primary"
          onclick="saveForm()"
        >
          Salva
        </button>

      </div>

    </div>

  </div>

</section>


<!-- =======================================================
     DETAIL
     ======================================================= -->

<section
  id="detailScreen"
  class="screen hidden"
>

  <div class="back-row">

    <button
      class="btn btn-secondary"
      onclick="backFromDetail()"
    >
      ← Indietro
    </button>

  </div>


  <div class="detail-container">

    <div class="detail-card">

      <div class="detail-title-row">

        <div>

          <h1
            id="detailTitle"
            class="detail-title"
          ></h1>

          <div
            id="detailCategory"
            class="detail-category"
          ></div>

        </div>


        <button
          id="detailFavoriteButton"
          class="detail-favorite-button"
          onclick="toggleCurrentFavorite()"
          title="Preferito"
        >
          ☆
        </button>

      </div>


      <!-- RATINGS -->

      <div class="detail-section">

        <h3>
          La nostra valutazione
        </h3>

        <div
          id="ratingsBox"
          class="ratings-box"
        ></div>

        <div
          id="averageRating"
          class="average-rating"
        ></div>

      </div>


      <!-- DESCRIPTION -->

      <div
        id="descriptionSection"
        class="detail-section hidden"
      >

        <h3>
          Descrizione
        </h3>

        <div
          id="detailDescription"
          class="description"
        ></div>

      </div>


      <!-- DETAILS -->

      <div class="detail-section">

        <h3>
          Informazioni
        </h3>

        <div
          id="detailsGrid"
          class="details-grid"
        ></div>

      </div>


      <!-- ACTIONS -->

      <div
        class="detail-section"
        style="
          display:flex;
          justify-content:flex-end;
          gap:10px;
          flex-wrap:wrap;
        "
      >

        <button
          class="btn btn-secondary"
          onclick="editCurrentItem()"
        >
          ✏️ Modifica
        </button>

        <button

(function () {

  const ODB_KEY_STORAGE = 'our_database_api_key_v1';

  function getApiKey() {
    let key = localStorage.getItem(ODB_KEY_STORAGE) || '';
    if (!key) {
      key = window.prompt('Inserisci la chiave API di OUR DATABASE (OUR_DATABASE_API_KEY configurata nelle proprietà dello script):') || '';
      key = key.trim();
      if (key) localStorage.setItem(ODB_KEY_STORAGE, key);
    }
    if (!key) throw new Error('Chiave API non inserita. Ricarica l’app per riprovare.');
    return key;
  }

  function apiPayload(action, args) {
    switch (action) {
      case 'getUsers':
      case 'getCategories':
      case 'getItems':
        return {};
      case 'getItemsByCategory':
        return { categoryId: args[0] };
      case 'getItemDetails':
      case 'deleteItem':
        return action === 'getItemDetails' ? { itemId: args[0] } : { itemId: args[0] };
      case 'createItem':
      case 'updateItem':
        return { item: args[0] };
      case 'toggleFavorite':
        return { itemId: args[0], userName: args[1] };
      case 'saveItemDetails':
        return { itemId: args[0], details: args[1] || {} };
      default:
        throw new Error('Azione database non supportata: ' + action);
    }
  }

  function callDatabase(action, args) {
    return new Promise(function(resolve, reject) {
      let key;
      try { key = getApiKey(); } catch (error) { reject(error); return; }
      const callbackName = '__odb_jsonp_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
      const script = document.createElement('script');
      const url = new URL(ODB_API_URL);
      const payload = apiPayload(action, args);
      url.searchParams.set('action', action);
      url.searchParams.set('key', key);
      url.searchParams.set('callback', callbackName);
      if (Object.keys(payload).length) url.searchParams.set('payload', JSON.stringify(payload));
      let finished = false;
      const timer = setTimeout(function() {
        finish(new Error('Timeout: il database non risponde. Controlla la connessione.'));
      }, 30000);
      function cleanup() {
        clearTimeout(timer);
        script.remove();
        try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
      }
      function finish(error, value) {
        if (finished) return;
        finished = true;
        cleanup();
        if (error) reject(error); else resolve(value);
      }
      window[callbackName] = function(response) {
        if (!response || response.ok !== true) {
          finish(new Error(response && response.error ? response.error : 'Risposta non valida dal database.'));
          return;
        }
        finish(null, response.data);
      };
      script.onerror = function() {
        finish(new Error('Connessione all’API Google Sheets non riuscita.'));
      };
      script.async = true;
      script.src = url.toString();
      document.head.appendChild(script);
    });

  function createGasCompatibleRunner() {
    let successHandler = null;
    let failureHandler = null;
    let userObject = null;
    let runner;
    runner = new Proxy({}, {
      get: function(_, property) {
        if (property === 'withSuccessHandler') return function(fn) { successHandler = fn; return runner; };
        if (property === 'withFailureHandler') return function(fn) { failureHandler = fn; return runner; };
        if (property === 'withUserObject') return function(value) { userObject = value; return runner; };
        if (property === 'withLogger') return function() { return runner; };

function toggleCurrentFavorite() {

  if (!currentItem) {
    return;
  }

  const oldValue =
    Boolean(currentItem.Preferito);


  /*
   * Aggiornamento immediato dell'interfaccia
   */

  currentItem.Preferito =
    !oldValue;

  updateFavoriteButton(
    currentItem
  );


  google.script.run

    .withSuccessHandler(function(result) {

      try {

        const response =
          JSON.parse(result);

        currentItem.Preferito =
          response.favorite;


        const index =
          allItems.findIndex(function(item) {

            return item.ID ===
              currentItem.ID;

          });


        if (index !== -1) {

          allItems[index].Preferito =
            response.favorite;

        }


        updateFavoriteButton(
          currentItem
        );

        updateFavoritesCount();

        showToast(
          response.favorite
            ? 'Aggiunto ai preferiti ⭐'
            : 'Rimosso dai preferiti'
        );

      }

      catch(error) {

        currentItem.Preferito =
          oldValue;

        updateFavoriteButton(
          currentItem
        );

        showError(
          'Errore aggiornamento preferito.'
        );

      }

    })

    .withFailureHandler(function(error) {

      currentItem.Preferito =
        oldValue;

      updateFavoriteButton(
        currentItem
      );

      showError(
        'Errore preferito: ' +
        error.message

/* =========================================================
   FORM HELPERS
   ========================================================= */

function addInput(
  container,
  label,
  id,
  type,
  full,
  value
) {

  const wrapper =
    document.createElement('div');

  wrapper.className =
    'form-group' +
    (full ? ' full' : '');


  const labelEl =
    document.createElement('label');

  labelEl.textContent =
    label;

  labelEl.htmlFor =
    id;


  const input =
    document.createElement('input');

  input.id =
    id;

  input.type =
    type;

  input.value =
    value || '';


  wrapper.appendChild(labelEl);
  wrapper.appendChild(input);

  container.appendChild(wrapper);

}


function addTextarea(
  container,
  label,
  id,
  value,
  full
) {

  const wrapper =
    document.createElement('div');

  wrapper.className =
    'form-group' +
    (full ? ' full' : '');


  const labelEl =
    document.createElement('label');

  labelEl.textContent =
    label;

  labelEl.htmlFor =
    id;


  const textarea =
    document.createElement('textarea');

  textarea.id =
    id;

  textarea.value =
    value || '';


  wrapper.appendChild(labelEl);
  wrapper.appendChild(textarea);

  container.appendChild(wrapper);

}


function addSelect(
  container,
  label,
  id,
  options,
  value
) {

  const wrapper =
    document.createElement('div');

  wrapper.className =
    'form-group';


  const labelEl =
    document.createElement('label');

  labelEl.textContent =
    label;


  const select =
    document.createElement('select');

  select.id =
    id;


  options.forEach(function(option) {

    const opt =
      document.createElement('option');

    opt.value =
      option;

    opt.textContent =
      option || '—';

    if (
      String(option) ===
      String(value || '')
    ) {
      opt.selected = true;
    }

    select.appendChild(opt);

  });


  wrapper.appendChild(labelEl);
  wrapper.appendChild(select);

  container.appendChild(wrapper);

}


function addCheckbox(
  container,
  label,
  id,
  checked
) {

  const wrapper =
    document.createElement('div');

  wrapper.className =
    'form-group';


  const labelEl =
    document.createElement('label');

  labelEl.style.display =
    'flex';

  labelEl.style.alignItems =
    'center';

  labelEl.style.gap =
    '9px';


  const input =
    document.createElement('input');

  input.type =
    'checkbox';

  input.id =
    id;

  input.checked =
    Boolean(checked);


  labelEl.appendChild(input);

  labelEl.appendChild(
    document.createTextNode(label)
  );


  wrapper.appendChild(labelEl);

  container.appendChild(wrapper);

}


/* =========================================================
   SAVE FORM
   ========================================================= */

function saveForm() {

  const titolo =
    document
      .getElementById('titolo')
      .value
      .trim();


  if (!titolo) {

    showToast(
      'Inserisci almeno un titolo.'
    );

    return;

  }


  const categoryId =
    editingItem
      ? editingItem.Categoria
      : currentCategory.ID;


  const item = {

    Categoria:
      categoryId,

    Titolo:
      titolo,

    Stato:
      getValue('stato'),

    Preferito:
      getChecked('preferito'),

    Descrizione:
      getValue('descrizione')

  };


  /*
   * MODIFICA
   */

  if (editingItem) {

    item.ID =
      editingItem.ID;

    item.Modificato_Da =
      currentUser.Nome;


    /*
     * Non tocchiamo nessuno dei due voti.
     * I voti vengono gestiti esclusivamente
     * dalla sezione "La nostra valutazione".
     */

    saveEditedItem(
      item
    );

    return;

  }


  /*
   * NUOVO ELEMENTO
   */

  item.Creato_Da =
    currentUser.Nome;


  google.script.run

    .withSuccessHandler(function(result) {

      try {

        const response =
          JSON.parse(result);

        const itemId =
          response.item.ID;


        const details =
          collectCategoryDetails();


        google.script.run

          .withSuccessHandler(function() {

            showToast(
              'Elemento creato!'
            );


            loadAllItems(function() {

              openItemById(
                itemId
              );

            });

          })

          .withFailureHandler(function(error) {

            showError(
              'Errore dettagli: ' +
              error.message
            );

          })

          .saveItemDetails(
            itemId,
            details
          );

      }

      catch(error) {

        showError(
          error.message
        );

      }

    })

    .withFailureHandler(function(error) {

      showError(
        'Errore creazione: ' +
        error.message
      );

    })

    .createItem(item);

}

/* =========================================================
   COLLECT DETAILS
   ========================================================= */

function collectCategoryDetails() {

  const details = {};

  const excluded = [

    'titolo',
    'stato',
    'preferito',
    'descrizione'

  ];


  document
    .getElementById('dynamicForm')
    .querySelectorAll(
      'input, textarea, select'
    )
    .forEach(function(element) {

      if (
        excluded.includes(
          element.id
        )
      ) {
        return;
      }


      if (
        element.type ===
        'checkbox'
      ) {

        details[element.id] =
          element.checked
            ? 'Sì'
            : 'No';

      }

      else {

        details[element.id] =
          element.value;

      }

    });


  return details;

}

/* =========================================================
   RATINGS
   ========================================================= */

function renderRatings(item) {

  const container =
    document.getElementById(
      'ratingsBox'
    );

  container.innerHTML = '';


  const users = [

    {
      id: 'USR-001',
      name: 'Mario',
      rating: item.Valutazione_Tu
    },

    {
      id: 'USR-002',
      name: 'Luisa',
      rating: item.Valutazione_Luisa
    }

  ];


  users.forEach(function(user) {

    const box =
      document.createElement('div');

    box.className =
      'person-rating';


    const canEdit =
      currentUser &&
      currentUser.User_ID ===
      user.id;


    const rating =
      parseRating(
        user.rating
      );


    let starsHtml = '';


    for (
      let i = 1;
      i <= 5;
      i++
    ) {

      const active =
        rating !== null &&
        i <= rating;


      if (canEdit) {

        starsHtml += `

          <button
            class="star ${active ? 'active' : ''}"
            onclick="setMyRating(${i})"
          >
            ★
          </button>

        `;

      }

      else {

        starsHtml += `

          <span
            class="star disabled ${active ? 'active' : ''}"
          >
            ★
          </span>

        `;

      }

    }


    box.innerHTML = `

      <div class="person-name">

        👤 ${escapeHtml(user.name)}

        ${
          canEdit
            ? '<span style="color:#8f97a5;font-size:11px">(tu)</span>'
            : ''
        }

      </div>

      <div class="stars">
        ${starsHtml}
      </div>

      <div class="rating-text">

        ${
          rating === null
            ? (
                canEdit
                  ? 'Clicca sulle stelle per votare'
                  : 'Non ha ancora votato'
              )
            : rating + '/5'
        }

      </div>

    `;


    container.appendChild(box);

  });


  updateAverageRating(
    item
  );

}


function setMyRating(value) {

  if (
    !currentItem ||
    !currentUser
  ) {
    return;
  }


  const update = {

    ID:
      currentItem.ID,

    Modificato_Da:
      currentUser.Nome

  };


  if (
    currentUser.User_ID ===
    'USR-001'
  ) {

    update.Valutazione_Tu =
      value;

  }

  else if (
    currentUser.User_ID ===
    'USR-002'
  ) {

    update.Valutazione_Luisa =
      value;

  }

  else {

    showError(
      'Utente non riconosciuto.'
    );

    return;

  }


  google.script.run

    .withSuccessHandler(function() {

      currentItem =
        Object.assign(
          {},
          currentItem,
          update
        );


      const index =
        allItems.findIndex(function(item) {

          return item.ID ===
            currentItem.ID;

        });


      if (index !== -1) {

        allItems[index] =
          Object.assign(
            {},
            allItems[index],
            update
          );

      }


      renderRatings(
        currentItem
      );

      showToast(
        'Voto salvato ⭐'
      );

    })

    .withFailureHandler(function(error) {

      showError(
        'Errore voto: ' +
        error.message
      );

    })

    .updateItem(update);

}


function updateAverageRating(item) {

  const average =
    calculateAverage(
      item.Valutazione_Tu,
      item.Valutazione_Luisa
    );


  const element =
    document.getElementById(
      'averageRating'
    );


  if (average === null) {

    element.textContent =
      'Nessuna valutazione ancora';

    return;

  }


  if (
    parseRating(item.Valutazione_Tu) !== null &&
    parseRating(item.Valutazione_Luisa) !== null
  ) {

    element.textContent =
      '⭐ Media: ' +
      formatRating(average) +
      '/5';

  }

  else {

    element.textContent =
      '⭐ Valutazione: ' +
      formatRating(average) +
      '/5';

  }

}


function calculateAverage(
  r1,
  r2
) {

  const a =
    parseRating(r1);

  const b =
    parseRating(r2);


  if (
    a === null &&
    b === null
  ) {
    return null;
  }

  if (a === null) {
    return b;
  }

  if (b === null) {
    return a;
  }

  return (a + b) / 2;

}


function parseRating(value) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {
    return null;
  }

  const n =
    Number(value);

  if (
    isNaN(n) ||
    n < 1 ||
    n > 5
  ) {
    return null;
  }

  return n;

}


function formatRating(value) {

  return Number(value)
    .toFixed(1)
    .replace('.0', '');

}

   ========================================================= */

function handleSearch() {

  const query =
    document
      .getElementById('searchInput')
      .value
      .trim()
      .toLowerCase();


  const resultsSection =
    document.getElementById(
      'searchResultsSection'
    );

  const homeContent =
    document.getElementById(
      'homeContent'
    );

  const favoritesCard =
    document.getElementById(
      'favoritesCard'
    );


  if (!query) {

    resultsSection.classList.add(
      'hidden'
    );

    homeContent.classList.remove(
      'hidden'
    );

    favoritesCard.classList.remove(
      'hidden'
    );

    return;

  }


  homeContent.classList.add(
    'hidden'
  );

  favoritesCard.classList.add(
    'hidden'
  );

  resultsSection.classList.remove(
    'hidden'
  );


  const results =
    allItems.filter(function(item) {

      return (

        String(
          item.Titolo || ''
        )
        .toLowerCase()
        .includes(query)

        ||

        String(
          item.Categoria || ''
        )
        .toLowerCase()
        .includes(query)

        ||

        String(
          item.Descrizione || ''
        )
        .toLowerCase()
        .includes(query)

      );

    });


  const container =
    document.getElementById(
      'searchResults'
    );

  container.innerHTML = '';


  if (results.length === 0) {

    container.innerHTML =
      '<div class="empty">Nessun risultato.</div>';

    return;

  }


  results.forEach(function(item) {

    container.appendChild(
      createItemCard(item)
    );

  });

}

  document
    .getElementById(
      'homeContent'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'favoritesCard'
    )
    .classList.remove(
      'hidden'
    );


  renderRecentItems();

  updateFavoritesCount();

}


function backFromDetail() {

  if (showingFavorites) {

    openFavorites();

    return;

  }


  if (currentCategory) {

    showScreen(
      'categoryScreen'
    );

    renderCategoryItems();

  }

  else {

    showHome();

  }

}


function cancelForm() {

  if (currentItem) {

    openItem(
      currentItem
    );

  }

  else if (currentCategory) {

    showScreen(
      'categoryScreen'
    );

  }

  else {

    showHome();

  }

}


/* =========================================================
   HELPERS
   ========================================================= */

function getValue(id) {

  const element =
    document.getElementById(id);

  return element
    ? element.value
    : '';

}


function getChecked(id) {

  const element =
    document.getElementById(id);

  return element
    ? element.checked
    : false;

}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


function showToast(message) {

  const toast =
    document.getElementById(
      'toast'
    );


  toast.textContent =
    message;


  toast.classList.add(
    'show'
  );


  setTimeout(function() {

    toast.classList.remove(
      'show'
    );

  }, 2500);

}


function showError(message) {

  console.error(message);

  showToast(
    message
  );

}
