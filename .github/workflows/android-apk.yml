name: Build OUR DATABASE Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Pubblica anche una GitHub Release con l'APK"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/OUR_DATABASE-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OUR-DATABASE-Android-APK
          path: output/OUR_DATABASE-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: OUR DATABASE Android v1.0.${{ github.run_number }}
          body: |
            APK Android generato automaticamente da GitHub Actions.
            Build di tipo debug: per installare aggiornamenti successivi con la stessa firma, in questa fase potrebbe essere necessario disinstallare la versione precedente.
          files: output/OUR_DATABASE-debug.apk
          generate_release_notes: true
