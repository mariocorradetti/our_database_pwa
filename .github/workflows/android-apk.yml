name: Build OUR DATABASE Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools;platforms;android-36;build-tools;36.0.0'

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -R icons www/icons

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/OUR_DATABASE-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OUR-DATABASE-Android-APK
          path: output/OUR_DATABASE-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: OUR DATABASE Android v1.0.${{ github.run_number }}
          body: |
            APK Android generato automaticamente da GitHub Actions.
            Questa prima versione è una build debug. Per aggiornamenti firmati in modo stabile configureremo una chiave release dedicata.
          files: output/OUR_DATABASE-debug.apk
          generate_release_notes: true
