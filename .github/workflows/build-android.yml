name: Build OUR DATABASE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - free-google-sheets-app

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web application
        run: npm run prepare:web

      - name: Use preview app identity on the working branch
        if: github.ref_name == 'free-google-sheets-app'
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));p.appId += '.preview';p.appName += ' Preview';fs.writeFileSync('capacitor.config.json',JSON.stringify(p,null,2));"

      - name: Add Android platform
        run: npx cap add android

      - name: Generate sunflower launcher icons
        run: |
          python -m pip install --disable-pip-version-check Pillow CairoSVG
          python scripts/prepare-android-icons.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OUR-DATABASE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish production APK on GitHub Releases
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.${{ github.run_number }}
          name: OUR DATABASE Android v1.1.${{ github.run_number }}
          body: |
            APK Android generato automaticamente da GitHub Actions.
            Questa build usa la firma debug. Per aggiornamenti in-place tra versioni successive servirà configurare una chiave di firma release stabile.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
