name: Build OUR DATABASE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - free-google-sheets-app

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web application
        run: npm run prepare:web

      - name: Use preview app identity on the working branch
        if: github.ref_name == 'free-google-sheets-app'
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));p.appId += '.preview';p.appName += ' Preview';fs.writeFileSync('capacitor.config.json',JSON.stringify(p,null,2));"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OUR-DATABASE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
